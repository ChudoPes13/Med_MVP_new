name: Docker Publish

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Extra Docker tag to publish"
        required: false
        default: "manual"
  push:
    branches: [main]
    paths:
      - "app/**"
      - "config/**"
      - "docs/**"
      - "docker/**"
      - "frontend/**"
      - "scripts/download_models.py"
      - "requirements.txt"
      - "Dockerfile"
      - ".github/workflows/docker-publish.yml"

env:
  IMAGE_NAME: chudopes/medjarvis-registry

jobs:
  docker:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate required secrets
        shell: bash
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          TTS_MODEL_URL: ${{ secrets.TTS_MODEL_URL }}
        run: |
          test -n "${DOCKERHUB_USERNAME}" || { echo "Missing DOCKERHUB_USERNAME"; exit 1; }
          test -n "${DOCKERHUB_TOKEN}" || { echo "Missing DOCKERHUB_TOKEN"; exit 1; }
          test -n "${TTS_MODEL_URL}" || { echo "Missing TTS_MODEL_URL"; exit 1; }

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.IMAGE_NAME }}:${{ github.event.inputs.tag || 'main' }}
          secrets: |
            hf_token=${{ secrets.HF_TOKEN }}
            tts_model_url=${{ secrets.TTS_MODEL_URL }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
